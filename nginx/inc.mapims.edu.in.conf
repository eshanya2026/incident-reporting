# Host-level nginx vhost for inc.mapims.edu.in → Statlog (the Docker nginx container on :1006).
#
# This is NOT the Docker Compose nginx (see nginx/nginx.conf, which stays on ports 1006/2006/3006).
# It's a separate config for the nginx already running directly on the production server
# (194.238.22.210), which owns ports 80/443 and already serves other sites (e.g. acl.mapims.edu.in).
#
# Deploy on the server:
#   sudo cp nginx/inc.mapims.edu.in.conf /etc/nginx/sites-available/inc.mapims.edu.in.conf
#   sudo ln -s /etc/nginx/sites-available/inc.mapims.edu.in.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get it a certificate and let certbot upgrade this file to HTTPS automatically:
#   sudo certbot --nginx -d inc.mapims.edu.in
#
# After that succeeds, update APP_URL and API_URL in the server's .env to the https:// address
# and run `docker compose up -d --build` so the app picks it up (see README's Production
# Deployment section) — this also switches the login cookie to Secure, which HTTPS requires.

server {
    listen 80;
    listen [::]:80;
    server_name inc.mapims.edu.in;

    client_max_body_size 15M;

    location / {
        proxy_pass http://127.0.0.1:1006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
