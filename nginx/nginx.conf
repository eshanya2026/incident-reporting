# Public entry point (published as port 1006). Serves the web app from the frontend container and
# forwards /api to the backend container (port 2006 inside the Docker network).

# Only send "Connection: upgrade" for real WebSocket upgrades; otherwise keep connections reusable
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Attachments are limited to 10 MB; leave room for the multipart overhead
    client_max_body_size 15M;

    # Real client IP. Requests reach this container through the server's own nginx (80/443), which
    # adds the visitor's address to X-Forwarded-For, and Docker's port proxy, which makes every
    # request look like it comes from the Docker gateway. Trust X-Forwarded-For only from those
    # private addresses, so the app logs the visitor (not 192.168.x.1) and per-person limits work.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://backend:2006/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Short links in WhatsApp messages: the backend records the tap and redirects into the app
    location /l/ {
        proxy_pass http://backend:2006/l/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files are served only through /api/v1/attachments/:id/download (access-checked)
}
