# Production stack.
#
#   Frontend (web app)  ->  http://<server>:1006   (nginx: serves the app and proxies /api to the backend)
#   Backend  (API)      ->  http://<server>:2006   (Express; also reachable directly, e.g. /health)
#
# Run with a dedicated env file so it never mixes with your local development .env:
#   cp .env.production.example .env.production      # then fill in the secrets
#   docker compose --env-file .env.production up -d --build
#
#   MongoDB             ->  127.0.0.1:3006         (this machine only, e.g. MongoDB Compass / backups)
#
# Redis is only reachable from the other containers.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mongo:
    image: mongo:7
    container_name: adhiparasakthi_mongo
    restart: unless-stopped
    # Host port 3006 -> MongoDB. Bound to this machine only (127.0.0.1): the database has no login,
    # so it must not be reachable from the network. Set MONGO_BIND=0.0.0.0 in the env file only if you
    # also restrict port 3006 with a firewall (e.g. to an admin PC) or enable MongoDB authentication.
    ports:
      - "${MONGO_BIND:-127.0.0.1}:3006:27017"
    environment:
      MONGO_INITDB_DATABASE: incident_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: adhiparasakthi_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks:
      - app_network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: adhiparasakthi_backend
    restart: unless-stopped
    ports:
      - "2006:2006"
    environment:
      NODE_ENV: production
      PORT: 2006
      MONGO_URI: mongodb://mongo:27017/incident_db
      REDIS_URL: redis://redis:6379
      # One reverse proxy (nginx) in front of the API: rate limits apply per user IP, not per proxy
      TRUST_PROXY: 1
      FILE_STORAGE_DRIVER: local
      FILE_STORAGE_PATH: uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}

      # The server refuses to start in production if these are missing, short (< 32 chars) or the
      # example values. Generate with:  openssl rand -hex 48
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env.production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env.production}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-12h}

      # Public addresses. APP_URL is the only origin the API accepts (CORS); use https:// once TLS is in place.
      APP_URL: ${APP_URL:-http://localhost:1006}
      API_URL: ${API_URL:-http://localhost:2006}

      # Email (optional)
      EMAIL_NOTIFICATIONS: ${EMAIL_NOTIFICATIONS:-false}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Adhiparasakthi Safety Portal <noreply@adhiparasakthi.hospital>}

      # WhatsApp via WATI (optional)
      WHATSAPP_NOTIFICATIONS: ${WHATSAPP_NOTIFICATIONS:-false}
      WATI_API_ENDPOINT: ${WATI_API_ENDPOINT:-}
      WATI_ACCESS_TOKEN: ${WATI_ACCESS_TOKEN:-}
      WATI_TEMPLATE_NAME: ${WATI_TEMPLATE_NAME:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - app_network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: adhiparasakthi_frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    logging: *default-logging
    networks:
      - app_network

  # Public entry point for the web app (port 1006). Same origin for the app and /api, so the
  # login cookie works without any cross-site configuration.
  nginx:
    image: nginx:alpine
    container_name: adhiparasakthi_nginx
    restart: unless-stopped
    ports:
      - "1006:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    logging: *default-logging
    networks:
      - app_network

volumes:
  mongo_data:
  redis_data:
  uploads_data:

networks:
  app_network:
    driver: bridge
