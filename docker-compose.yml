version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: adhiparasakthi_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: incident_db
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: adhiparasakthi_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: adhiparasakthi_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/incident_db
      REDIS_URL: redis://redis:6379
      FILE_STORAGE_PATH: uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongo
      - redis
    networks:
      - app_network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: adhiparasakthi_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: adhiparasakthi_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app_network

volumes:
  mongo_data:
  redis_data:
  uploads_data:

networks:
  app_network:
    driver: bridge
