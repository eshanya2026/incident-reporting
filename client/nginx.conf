# Serves the built single-page app. Unknown paths (e.g. /my-reports, /incidents/:id) fall back to
# index.html so refreshing a page or opening a shared link works; React Router handles the route.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        # Vite adds a content hash to these file names, so they can be cached for long
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # Always revalidate index.html so users get new releases immediately
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
